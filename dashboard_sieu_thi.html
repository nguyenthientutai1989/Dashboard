<style>

/* ── NAVBAR ── */

  padding-right:10px;

  font-size:13px;
}

  height:var(--nav-h);
  background:var(--nav-bg);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  align-items:center;
  padding:0 16px;
  gap:0;

}

.nav-brand{

  gap:8px;
  text-decoration:none;
  margin-right:auto;
}
.nav-brand-badge{
  background:var(--accent);

  font-size:10px;

  letter-spacing:0.08em;
  padding:3px 8px;
  border-radius:5px;

}
.nav-brand-name{

  font-weight:700;

}
.nav-page-badge{

  font-weight:600;

.nav-user{

.nav-user-dot{

/* ── ORIGINAL STYLES ── */
.container{max-width:860px;margin:0 auto;}

.form-wrap{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:7px;}

.upload-box.dt:hover{border-color:#1565c0;background:#eef6ff;}
.upload-box.td{border-color:#f5c8bc;}
.upload-box.td:hover{border-color:#e53935;background:#fff3f1;}

.upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

<div class="container">

<script>
// ── DỮ LIỆU ĐÃ ĐỌC TỪ 2 FILE EXCEL ──
let g1 = null; // dữ liệu doanh thu hợp nhất (đã parse từ file Excel)

const ICONS={
  'flagship':'🔥','smartphone':'📱','điện thoại':'📱','realme':'📱','vivo':'📱',
  'iphone':'📱','samsung':'📱','pin sạc':'🔋','tai nghe':'🎵','sim':'📶',
  'phụ kiện':'🎧','máy lọc':'💧','camera':'📷','đồng hồ':'⏱️','laptop':'💻',
  'wearable':'⌚','tablet':'📟','homecredit':'💳','fecredit':'🏦','shinhan':'🏦',
  'ví trả sau':'💰','vay tiền':'💵','vas':'🔧','tpbank':'✨','vpbank':'✨',
  'bảo hiểm':'🛡️','rút tiền':'🏧','quạt':'🌀','gia dụng':'🏠',
  'máy lạnh':'❄️','điện tử':'📺','thẻ cào':'🎴','default':'📦'
};
function getIcon(n){
  const l=n.toLowerCase();
  for(const k in ICONS) if(l.includes(k)) return ICONS[k];
  return ICONS['default'];
}

function rowStyle(p){
  if(p===null||isNaN(p)||p===0)
    return {bg:'#fff0f0',border:'#f5b8b8',name:'#c0392b',nums:'#c0392b',pct:'#e84a5f'};
  if(p>=100) return {bg:'#edfaf3',border:'#5bc888',name:'#1a7a3e',nums:'#2a8a4e',pct:'#1aaa55'};
  if(p>=80)  return {bg:'#f5fded',border:'#a0d878',name:'#3a6e10',nums:'#4a8020',pct:'#5a9a20'};
  if(p>=60)  return {bg:'#fffbec',border:'#f5d060',name:'#7a5c00',nums:'#8a6c00',pct:'#c08000'};
  if(p>=40)  return {bg:'#fff6ec',border:'#f5b060',name:'#8a4500',nums:'#9a5000',pct:'#d06010'};
  if(p>=20)  return {bg:'#fff2ee',border:'#f5a080',name:'#8a2800',nums:'#9a3800',pct:'#d04020'};
  return           {bg:'#fff0f0',border:'#f5b8b8',name:'#c0392b',nums:'#c0392b',pct:'#e84a5f'};
}

function fmtPct(p){
  if(p===null||isNaN(p)) return '0%';
  return Math.round(p)+'%';
}

// ── ĐỌC FILE EXCEL (.xlsx) BẰNG SheetJS ──
// Trả về mảng-các-mảng (array of arrays), dòng đầu là header
function readSheetAsRows(workbook){
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  return XLSX.utils.sheet_to_json(sheet, {header:1, defval:null, raw:true});
}

// Tìm vị trí cột theo tên (không phân biệt hoa/thường, có dấu),
// mustInclude: mảng từ khóa PHẢI có trong tên cột
// mustExclude: mảng từ khóa KHÔNG được có trong tên cột
function findCol(headers, mustInclude, mustExclude){
  for(let i=0;i<headers.length;i++){
    const h = (headers[i]==null?'':String(headers[i])).toLowerCase().trim();
    if(!h) continue;
    if(!mustInclude.every(k=>h.includes(k))) continue;
    if(mustExclude && mustExclude.some(k=>h.includes(k))) continue;
    return i;
  }
  return -1;
}
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }

// ── FILE 1: DOANH THU HỢP NHẤT ──
// Hỗ trợ 2 kiểu file:
//  a) File cây ngành hàng (CẤP DÒNG=CATEGORY/SUBGROUP, TÊN ĐƠN VỊ, SỐ LƯỢNG, DOANH THU (TR), TARGET (TR), DT TRẢ GÓP (TR)...)
//  b) File có sẵn dòng "Tổng" tổng hợp
function parseFile1(rows){
  if(!rows || !rows.length) return {totalDT:0,totalTgt:0,totalPct:0,tgPct:0,ictRows:[],bkRows:[],totICT:0};
  const headers = rows[0].map(h=>h==null?'':String(h).toLowerCase().trim());
  const iLevel  = findCol(headers,['cấp dòng']);
  const iName   = findCol(headers,['tên đơn vị']) >=0 ? findCol(headers,['tên đơn vị']) : findCol(headers,['tên']);
  const iSL     = findCol(headers,['số lượng']);
  const iDT     = findCol(headers,['doanh thu','qđ']);
  const iTarget = findCol(headers,['target'],['qđ']);
  const iTraGop = findCol(headers,['trả góp'],['qđ']);

  const data = [];
  let tongRow = null;
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row) continue;
    const name = iName>=0 ? String(row[iName]||'').trim() : '';
    if(!name) continue;
    const level = iLevel>=0 ? String(row[iLevel]||'').toUpperCase().trim() : '';
    const item = {
      level, name, nameLow:name.toLowerCase(),
      sl:  iSL>=0?num(row[iSL]):0,
      dt:  iDT>=0?num(row[iDT]):0,
      tgt: iTarget>=0?num(row[iTarget]):0,
      tragop: iTraGop>=0?num(row[iTraGop]):0,
    };
    if(item.nameLow==='tổng') tongRow = item;
    data.push(item);
  }

  // Tổng doanh thu / target / trả góp
  let totalDT=0,totalTgt=0,totalTraGop=0;
  if(tongRow){
    totalDT=tongRow.dt; totalTgt=tongRow.tgt; totalTraGop=tongRow.tragop;
  } else {
    // Không có dòng "Tổng" → cộng ở cấp cao nhất (CATEGORY) để tránh cộng đôi với SUBGROUP con
    const topRows = iLevel>=0 ? data.filter(d=>d.level==='CATEGORY') : data;
    for(const d of topRows){ totalDT+=d.dt; totalTgt+=d.tgt; totalTraGop+=d.tragop; }
  }
  const totalPct = totalTgt>0 ? Math.round(totalDT/totalTgt*100) : 0;
  const tgPct = totalDT>0 ? (totalTraGop/totalDT*100) : 0;

  // Ngành hàng ICT + Bán kèm: match theo tên (cấp cao nhất, tránh double-count)
  const topForICT = iLevel>=0 ? data.filter(d=>d.level==='CATEGORY' || d.nameLow.startsWith('nnh ')) : data;
  const ictRows = ICT_MAP.map(cat=>{
    let sl=0,dt=0,tgt=0;
    for(const d of topForICT){ if(cat.keys.some(k=>d.nameLow.includes(k))){ sl+=d.sl; dt+=d.dt; tgt+=d.tgt; } }
    const pct = tgt>0 ? Math.round(dt/tgt*100) : 0;
    return {label:cat.label, sl, dt, tgt, pct};
  }).filter(r=>r.sl>0||r.tgt>0);
  const ICT_BASE=['Điện Thoại','Tablet','Laptop'];
  const totICT = ictRows.filter(r=>ICT_BASE.includes(r.label)).reduce((s,r)=>s+r.sl,0);

  // Bán kèm: quét TOÀN BỘ dòng (kể cả SUBGROUP con) để bắt pin sạc, tai nghe, sim...
  const bkRows = BK_MAP.map(cat=>{
    let sl=0;
    for(const d of data){ if(cat.keys.some(k=>d.nameLow.includes(k))) sl+=d.sl; }
    const pct = totICT>0 ? Math.round(sl/totICT*100) : null;
    return {label:cat.label, sl, pct};
  }).filter(r=>r.sl>0);

  return {totalDT,totalTgt,totalPct,tgPct,ictRows,bkRows,totICT};
}

// ── VÙNG 2: DỮ LIỆU THI ĐUA (DÁN TRỰC TIẾP) ──
// Mỗi chương trình là 1 khối 6 dòng dạng:
//   Tên chương trình
//   SỐ LƯỢNG (RT) / DOANH THU (RT)   TARGET   % HT NGÀY   % DỰ BÁO   HẠNG VÙNG   TOP/BOTTOM VÙNG
//   TỔNG
//   <giá trị dòng Tổng, cách nhau bằng tab>
//   TGD_...(tên siêu thị)
//   <giá trị dòng siêu thị, cách nhau bằng tab>  ← lấy HẠNG VÙNG ở đây (cột thứ 5)
// Dòng đầu "SỐ LƯỢNG (RT)" hay "DOANH THU (RT)" cho biết chương trình này thi đua
// theo số lượng hay theo doanh thu, để hiển thị đúng đơn vị.
function parseV2(raw){
  if(!raw || !raw.trim()) return [];
  const lines = raw.replace(/\r/g,'').split('\n');
  const items=[];
  let i=0;

  function isKeywordLine(l){
    const u=l.trim().toUpperCase();
    return u==='' || u==='TỔNG' || u.startsWith('TGD_') || l.includes('\t');
  }

  while(i<lines.length){
    const line = lines[i];
    if(isKeywordLine(line)){ i++; continue; }
    // Dòng tên chương trình
    const name = line.trim();
    i++;
    while(i<lines.length && !lines[i].trim()) i++;
    if(i>=lines.length) break;

    // Dòng header (chứa TARGET, HẠNG VÙNG...) → xác định SL hay DT
    const headerLine = lines[i].toUpperCase();
    const isSL = headerLine.includes('SỐ LƯỢNG');
    i++;
    while(i<lines.length && !lines[i].trim()) i++;

    // Dòng nhãn "TỔNG"
    if(i<lines.length && lines[i].trim().toUpperCase()==='TỔNG') i++;
    while(i<lines.length && !lines[i].trim()) i++;
    if(i>=lines.length) break;

    // Dòng dữ liệu Tổng: [dt/sl, target, %HT, %dựbáo, hạngvùng(trống), top/bottom]
    const tCols = lines[i].split('\t');
    i++;
    const dt  = parseFloat((tCols[0]||'').replace(',','.')) || 0;
    const tgt = parseFloat((tCols[1]||'').replace(',','.')) || 0;
    const pctRaw = (tCols[2]||'').replace('%','').replace(',','.').trim();
    const pct = (pctRaw===''||pctRaw==='-'||isNaN(parseFloat(pctRaw))) ? null : parseFloat(pctRaw);

    // Dòng tên siêu thị (TGD_...) rồi dòng dữ liệu siêu thị chứa hạng vùng thật
    let rank=0;
    while(i<lines.length && !lines[i].trim()) i++;
    if(i<lines.length && lines[i].trim().toUpperCase().startsWith('TGD_')){
      i++;
      while(i<lines.length && !lines[i].trim()) i++;
      if(i<lines.length){
        const sCols = lines[i].split('\t');
        rank = parseInt(sCols[4]) || 0;
        i++;
      }
    }
    items.push({name, dt, tgt, pct, rank, isSL});
  }

  items.sort((a,b)=>{
    const pa=(a.pct===null||isNaN(a.pct))?-Infinity:a.pct;
    const pb=(b.pct===null||isNaN(b.pct))?-Infinity:b.pct;
    return pb-pa;
  });
  return items;
}

function makeRow(g){
  const s=rowStyle(g.pct);
  const rankStr=g.rank>0?`#${g.rank} trong miền`:'';
  const isSL = !!g.isSL;
  const dtStr  = isSL ? Math.round(g.dt)  : g.dt.toFixed(1);
  const tgtStr = isSL ? Math.round(g.tgt) : g.tgt.toFixed(1);
  const unit = isSL ? ' SL' : ' tr';
  return `<div class="krow" style="background:${s.bg};border-left-color:${s.border};">
    <span class="krow-icon">${getIcon(g.name)}</span>
    <span class="krow-name" style="color:${s.name};">${g.name}</span>
    <div class="krow-right">
      <div class="krow-nums" style="color:${s.nums};">${dtStr}${unit} / ${tgtStr}${unit}</div>
      <div class="krow-pct" style="color:${s.pct};">${fmtPct(g.pct)}</div>
      ${rankStr?`<div class="krow-rank" style="color:${s.nums};">${rankStr}</div>`:''}
    </div>
  </div>`;
}

function pctColor(p){
  if(p===null||isNaN(p)) return '';
  if(p>=50) return 'pct-hi';
  if(p>=30) return 'pct-mid';
  return 'pct-lo';
}

function buildICTTable(ictRows, totICT){
  if(!ictRows.length) return '';
  const rows = ictRows.map(r=>{
    const pctCol = r.tgt>0
      ? `<td class="pct ${r.pct>=100?'pct-hi':r.pct>=70?'pct-mid':'pct-lo'}">${r.pct}%</td>`
      : `<td class="pct">—</td>`;
    return `<tr>
      <td><b>${r.label}</b></td>
      <td class="num">${r.sl}</td>
      <td class="num">${r.dt.toFixed(1)}</td>
      ${pctCol}
    </tr>`;
  }).join('');
  return `
    <div class="ict-box">
      <div class="ict-title ict">📱 Ngành Hàng ICT</div>
      <table class="ict-table">
        <thead><tr class="ict-head-ict">
          <th>Nhóm Hàng</th>
          <th class="r">SL</th>
          <th class="r">Doanh Thu</th>
          <th class="r">% HT</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${totICT>0?`<div class="ict-note">Tổng ICT (ĐT+Tablet+Laptop): <b style="color:#1565c0">${totICT}</b> máy</div>`:''}
    </div>`;
}

function buildBKTable(bkRows, totICT){
  if(!bkRows.length) return '';
  const rows = bkRows.map(r=>{
    const cls=pctColor(r.pct);
    return `
    <tr>
      <td><b>${r.label}</b></td>
      <td class="num-bk">${r.sl}</td>
      <td class="pct ${cls}">${r.pct!==null?r.pct+'%':'—'}</td>
    </tr>`;
  }).join('');
  return `
    <div class="ict-box">
      <div class="ict-title bk">🎧 Bán Kèm</div>
      <table class="ict-table">
        <thead><tr class="ict-head-bk">
          <th>Bán Kèm</th>
          <th class="r">Số Lượng</th>
          <th class="r">% KT/ICT</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="ict-note">Đo lường trên Điện Thoại, Tablet, Laptop</div>
    </div>`;
}

// ── XỬ LÝ UPLOAD FILE EXCEL (Vùng 1 - Doanh thu) ──
async function handleFile(which){
  const inputEl  = document.getElementById('f'+which);
  const boxEl    = document.getElementById('box'+which);
  const nameEl   = document.getElementById('f'+which+'-name');
  const statusEl = document.getElementById('f'+which+'-status');
  const file = inputEl.files[0];
  if(!file) return;

  nameEl.textContent = '📄 '+file.name;
  statusEl.className = 'upload-status wait';
  statusEl.textContent = 'Đang đọc file...';

  try{
    const buf = await file.arrayBuffer();
    const wb  = XLSX.read(buf, {type:'array'});
    const rows = readSheetAsRows(wb);
    if(!rows || rows.length<2) throw new Error('empty');

    g1 = parseFile1(rows);
    statusEl.textContent = `✓ Đã đọc ${rows.length-1} dòng — DT ${g1.totalDT.toFixed(0)}tr`;
    statusEl.className = 'upload-status ok';
    boxEl.classList.add('has-file');
    build();
  } catch(err){
    statusEl.className = 'upload-status err';
    statusEl.textContent = '✗ Không đọc được file, kiểm tra lại định dạng .xlsx';
    boxEl.classList.remove('has-file');
    g1=null;
  }
}

function build(){
  const h = g1 ? {...g1} : {totalDT:0,totalTgt:0,totalPct:0,tgPct:0,ictRows:[],bkRows:[],totICT:0};

  // Vùng 2: đọc trực tiếp từ ô dán dữ liệu thi đua
  const raw2 = (document.getElementById('d2').value||'').trim();
  const items = raw2 ? parseV2(raw2) : [];
  const f2Status = document.getElementById('f2-status');
  if(f2Status){
    if(!raw2){ f2Status.className='paste-status wait'; f2Status.textContent='Chưa có dữ liệu'; }
    else if(items.length===0){ f2Status.className='paste-status err'; f2Status.textContent='✗ Không nhận diện được dữ liệu, kiểm tra lại định dạng dán'; }
    else{ f2Status.className='paste-status ok'; f2Status.textContent=`✓ Đã đọc ${items.length} chương trình thi đua`; }
  }

  // Target doanh thu tổng: ưu tiên số người dùng tự nhập (vì file thường không có sẵn target)
  const manualTargetEl = document.getElementById('manualTarget');
  const manualTarget = manualTargetEl ? parseFloat(manualTargetEl.value) : NaN;
  if(!isNaN(manualTarget) && manualTarget>0){
    h.totalTgt = manualTarget;
  }
  h.totalPct = h.totalTgt>0 ? Math.round(h.totalDT/h.totalTgt*100) : 0;

  const con=Math.max(0,h.totalTgt-h.totalDT);
  const nhomDat=items.filter(g=>g.pct!==null&&!isNaN(g.pct)&&g.pct>=100).length;
  const half=Math.ceil(items.length/2);
  const leftItems=items.slice(0,half);
  const rightItems=items.slice(half);
  const now=new Date();
  const timeStr=now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  const dateStr=now.toLocaleDateString('vi-VN');

  // Bảng ICT + Bán Kèm từ file doanh thu
  const ictHtml = buildICTTable(h.ictRows||[], h.totICT||0);
  const bkHtml  = buildBKTable(h.bkRows||[], h.totICT||0);
  const ictWrap = (ictHtml||bkHtml)
    ? `<div class="ict-wrap">${ictHtml||'<div></div>'}${bkHtml||'<div></div>'}</div>`
    : '';

  if(!g1 && items.length===0){
    document.getElementById('db').innerHTML = '<div class="empty">Chưa có dữ liệu — upload file doanh thu & dán dữ liệu thi đua ở trên</div>';
    document.getElementById('btnImg').style.display='none';
    return;
  }

  document.getElementById('db').innerHTML=`
    <div class="top-cards">
      <div class="tc">
        <div class="tc-label">Doanh thu</div>
        <div class="tc-val">${h.totalDT.toFixed(0)}/${h.totalTgt.toFixed(0)}tr</div>
        <div class="tc-sub">Còn thiếu: ${con.toFixed(0)}tr</div>
      </div>
      <div class="tc">
        <div class="tc-label">Tiến độ (%)</div>
        <div class="tc-val">${fmtPct(h.totalPct)}</div>
      </div>
      <div class="tc">
        <div class="tc-label">Trả góp (MT 60%)</div>
        <div class="tc-val red">${h.tgPct.toFixed(1)}%</div>
      </div>
      <div class="tc">
        <div class="tc-label">Nhóm hàng đạt</div>
        <div class="tc-val">${nhomDat}/${items.length}</div>
      </div>
    </div>
    ${ictWrap}
    ${items.length>0
      ?`<div class="grid2">
          <div class="gcol">${leftItems.map(makeRow).join('')}</div>
          <div class="gcol">${rightItems.map(makeRow).join('')}</div>
        </div>`
      :'<div class="empty">Chưa có dữ liệu thi đua — upload file báo cáo thi đua ở trên</div>'
    }
    <div class="footer">Dashboard Siêu Thị — Cập nhật lúc: <b>${timeStr} - ${dateStr}</b></div>`;

  document.getElementById('btnImg').style.display='inline-block';
}

function saveImg(){
  const el=document.getElementById('db');
  const btn=document.getElementById('btnImg');
  const orig=btn.textContent;
  btn.textContent='⏳ Đang tạo...';
  btn.disabled=true;

  html2canvas(el,{
    scale:2,
    useCORS:true,
    backgroundColor:'#e8e8e8',
    logging:false
  }).then(canvas=>{
    const now=new Date();
    const ts=now.toLocaleDateString('vi-VN').replace(/\//g,'-')
             +'_'+now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}).replace(':','-');
    const a=document.createElement('a');
    a.download='dashboard_'+ts+'.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
    btn.textContent=orig;
    btn.disabled=false;
  }).catch(()=>{
    alert('Lỗi tạo ảnh, thử lại nhé!');
    btn.textContent=orig;
    btn.disabled=false;
  });
}

// Trạng thái ban đầu
build();
